name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The models use JSONB, INET and partial unique indexes, so the tests run
    # against a real PostgreSQL rather than SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doz
          POSTGRES_PASSWORD: doz
          POSTGRES_DB: doz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app scripts tests

      - name: Test
        env:
          DOZ_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://doz:doz@localhost:5432/postgres
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  installer-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ramdisk runs BusyBox ash. dash is the closest thing available here
      # and catches bashisms that would fail on a machine in a rack.
      - name: Syntax-check the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          for f in doz.sh installer/build-ramdisk.sh deploy/*.sh; do bash -n "$f"; done
          shellcheck -S warning -e SC1091,SC2086,SC2046 doz.sh installer/build-ramdisk.sh deploy/*.sh || true
